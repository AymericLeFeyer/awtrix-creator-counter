version: '3.8' 

services:
  app:
    build: .
    container_name: awtrix-creator-counter
    ports:
      - "4444:4444"
    working_dir: /app
    environment:
      - PORT=4444
      - AYLABS_CREATOR_STUDIO_URL=${AYLABS_CREATOR_STUDIO_URL}
      - AYLABS_CREATOR_STUDIO_KEY=${AYLABS_CREATOR_STUDIO_KEY}
      - AWTRIX_URL=${AWTRIX_URL}
    restart: always
    command: npm run start